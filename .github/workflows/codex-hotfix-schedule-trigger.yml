name: Codex one-time hotfix scheduled trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  trigger-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hotfix workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run codex-hotfix-logo-shop.yml --ref main
