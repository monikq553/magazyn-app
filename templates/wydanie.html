{% extends "base.html" %}

{% block content %}

<style>
.box {
    background:white;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    box-shadow:0 12px 24px rgba(15,23,42,0.05);
    max-width:900px;
    width:100%;
    min-width:0;
}

input, select {
    padding:10px;
    border-radius:8px;
    border:1px solid #d1d5db;
    width:100%;
    margin-bottom:10px;
    font-size:14px;
}

button {
    background:#FFC067;
    color:#422d00;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.add { background:#FFC067; }

.item {
    padding:15px;
    background:#f8fbff;
    border-radius:10px;
    margin-bottom:12px;
    border:1px solid #e2e8f0;
    min-width:0;
}

.info {
    font-size:13px;
    color:#666;
}

.suggestions div {
    padding:8px;
    cursor:pointer;
}

.suggestions div:hover {
    background:#f1f5f9;
}

.item-actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

@media (max-width:640px) {
    .box {
        padding:14px;
        border-radius:8px;
    }
    .item {
        padding:12px;
    }
    .item-actions {
        flex-direction:column;
    }
}
</style>

<div class="box">

<h2>{{ page_title or "Wydanie (WZ)" }}</h2>

<form method="POST" action="{{ form_action or '/issue_doc' }}" enctype="multipart/form-data">

<!-- 🔥 DOKUMENT -->
<input name="doc_number" placeholder="Numer dokumentu (np. WZ/01)">
<input type="date" name="date" required>
<input name="kontrahent" placeholder="Kontrahent" required>
<select name="movement_type" required>
<option value="WZ">WZ — wydanie zewnętrzne</option>
<option value="RW">RW — rozchód wewnętrzny</option>
</select>

<hr>

<h3>Pozycje</h3>

<div id="items">

<div class="item">

<!-- 🔍 PRODUKT -->
<div style="position:relative;">
    <input type="text" placeholder="Produkt..."
    onkeyup="searchProduct(this)"
    class="product-input">

    <input type="hidden" name="product_id">

    <div class="suggestions" style="
        position:absolute;
        background:white;
        width:100%;
        border:1px solid #ddd;
        border-radius:8px;
        display:none;
        max-height:150px;
        overflow:auto;
        z-index:10;
    "></div>
</div>

<div class="info"></div>

<!-- 🔥 MAGAZYN -->
{% if forced_warehouse %}
<input type="hidden" name="warehouse" value="{{ forced_warehouse }}">
<input value="{{ forced_warehouse }}" disabled>
{% else %}
<select name="warehouse">
<option>Drewno</option>
<option>Farby</option>
<option>Śruby i wkręty</option>
<option>Pellet</option>
<option>Golden Oak</option>
<option>Inne</option>
</select>
{% endif %}

<!-- 🔥 PACZKA -->
<input type="text" class="package-number-input" maxlength="100"
       placeholder="Wpisz numer paczki" onblur="lookupPackage(this)">
<input type="hidden" name="package_id">
<button type="button" onclick="lookupPackage(this.closest('.item').querySelector('.package-number-input'))">Wyszukaj paczkę</button>

<div class="info package-info"></div>

<!-- 🔥 ILOŚĆ -->
<input name="qty" type="number" min="0.001" step="0.001" placeholder="Ilość" required>
<input name="price_netto" type="number" min="0" step="0.01" placeholder="Cena netto">
<input name="price_brutto" type="number" min="0" step="0.01" placeholder="Cena brutto">

<!-- 🔥 JEDNOSTKA -->
<select name="unit">
<option>m2</option>
<option>m3</option>
<option>szt</option>
<option>l</option>
<option>opak</option>
<option>kg</option>
</select>

<!-- USUŃ -->
<div class="item-actions">
    <button type="button" onclick="removeItem(this)" style="background:red;">Usuń</button>
</div>

</div>

</div>

<button type="button" class="add" onclick="addItem()">Dodaj pozycję</button>

<hr>

<h3>Zdjęcia wydania</h3>
<p class="info">Dodaj zdjęcia paczki, towaru, załadunku lub uszkodzeń. Działa na telefonie, tablecie i komputerze.</p>
<input name="photos" type="file" accept="image/*" capture="environment" multiple>
<input name="photo_note" placeholder="Opis zdjęć (opcjonalnie)">

<hr>

<button>Wydaj</button>

</form>

</div>

<script>
const PRODUCTS = [
{% for p in products %}
{ id: {{p[0]|tojson}}, name: {{p[1]|tojson}}, qty: {{p[2]|tojson}}, unit: {{p[3]|tojson}}, warehouse: {{p[4]|tojson}}, price_netto: {{p[5]|tojson}}, vat: {{p[6]|tojson}} },
{% endfor %}
];

// 🔍 SZUKANIE PRODUKTU
function searchProduct(input) {
    let value = input.value.toLowerCase();
    let box = input.parentElement.querySelector(".suggestions");
    let hidden = input.parentElement.querySelector("input[name='product_id']");
    let info = input.closest(".item").querySelector(".info");

    box.innerHTML = "";

    if (!value) {
        box.style.display = "none";
        hidden.value = "";
        return;
    }

    let found = PRODUCTS.filter(p => p.name.toLowerCase().includes(value));

    found.forEach(p => {
        let div = document.createElement("div");
        div.innerText = p.name + " (" + p.warehouse + ")";

        div.onclick = () => {
            input.value = p.name;
            hidden.value = p.id;

            info.textContent = "Stan: " + p.qty + " " + p.unit;
            let item = input.closest(".item");
            item.dataset.vat = String(p.vat || 0);
            let nettoInput = item.querySelector("input[name='price_netto']");
            let bruttoInput = item.querySelector("input[name='price_brutto']");
            nettoInput.value = p.price_netto || "";
            let netto = parseFloat((p.price_netto || "0").toString().replace(",", "."));
            bruttoInput.value = (netto * (1 + Number(p.vat || 0) / 100)).toFixed(2);
            item.querySelector("select[name='unit']").value = p.unit;

            // 🔥 ustaw magazyn (gdy jest select)
            let warehouseSelect = input.closest(".item").querySelector("select[name='warehouse']");
            if (warehouseSelect) {
                warehouseSelect.value = p.warehouse;
            }

            // Zmiana produktu unieważnia wcześniej wyszukaną paczkę.
            item.querySelector("input[name='package_id']").value = "";
            item.querySelector(".package-number-input").value = "";
            item.querySelector(".package-number-input").setCustomValidity("");
            item.querySelector(".package-info").textContent = "";

            box.style.display = "none";
        };

        box.appendChild(div);
    });

    box.style.display = "block";
}

// 📦 INFO PACZKI
async function lookupPackage(input) {
    const item = input.closest(".item");
    let info = item.querySelector(".package-info");
    const hiddenPackage = item.querySelector("input[name='package_id']");
    hiddenPackage.value = "";
    info.textContent = "";
    const number = input.value.trim();
    if (!number) return;
    const warehouseInput = item.querySelector("[name='warehouse']");
    const params = new URLSearchParams({number});
    if (warehouseInput && warehouseInput.type === "hidden" && warehouseInput.value) {
        params.set("warehouse", warehouseInput.value);
    }
    let response;
    let data;
    try {
        response = await fetch("/api/packages/lookup?" + params.toString());
        data = await response.json();
        if (response.status === 409 && warehouseInput && warehouseInput.value) {
            params.set("warehouse", warehouseInput.value);
            response = await fetch("/api/packages/lookup?" + params.toString());
            data = await response.json();
        }
    } catch (_) {
        info.textContent = "Nie udało się połączyć z serwerem.";
        input.setCustomValidity(info.textContent);
        return;
    }
    if (!response.ok || !data.ok) {
        info.textContent = data.error || "Nie znaleziono paczki.";
        input.setCustomValidity(info.textContent);
        return;
    }
    input.setCustomValidity("");
    const pkg = data.package;
    const product = PRODUCTS.find(p => String(p.id) === String(pkg.product_id));
    if (!product) {
        info.textContent = "Produkt paczki nie jest dostępny w tym formularzu.";
        input.setCustomValidity(info.textContent);
        return;
    }
    hiddenPackage.value = pkg.id;
    info.textContent = "Paczka " + pkg.number + " — dostępne: " + pkg.qty + " " + pkg.unit;
    item.querySelector(".product-input").value = product.name;
    item.querySelector("input[name='product_id']").value = product.id;
    item.querySelector("input[name='qty']").value = "";
    item.querySelector("input[name='qty']").max = pkg.qty;
    const warehouseSelect = item.querySelector("select[name='warehouse']");
    if (warehouseSelect) warehouseSelect.value = pkg.warehouse;
    item.querySelector("input[name='price_netto']").value = product.price_netto || "";
    item.dataset.vat = String(product.vat || 0);
    item.querySelector("select[name='unit']").value = product.unit;
    const netto = Number(product.price_netto || 0);
    item.querySelector("input[name='price_brutto']").value =
        (netto * (1 + Number(product.vat || 0) / 100)).toFixed(2);
    item.querySelector(".info").textContent = "Stan produktu: " + product.qty + " " + product.unit;
}

// ➕ DODAJ
function addItem() {
    let div = document.createElement("div");
    div.classList.add("item");
    div.innerHTML = document.querySelector(".item").innerHTML;
    document.getElementById("items").appendChild(div);
}

// ❌ USUŃ
function removeItem(btn) {
    btn.closest(".item").remove();
}

document.addEventListener("input", function(e){
    if (!e.target) return;
    const item = e.target.closest(".item");
    if (!item) return;

    const nettoInput = item.querySelector("input[name='price_netto']");
    const bruttoInput = item.querySelector("input[name='price_brutto']");
    const VAT = Number(item.dataset.vat || 23) / 100;

    if (e.target.name === "price_netto") {
        const nettoVal = parseFloat((nettoInput.value || "0").replace(",", "."));
        if (!Number.isNaN(nettoVal)) {
            bruttoInput.value = (nettoVal * (1 + VAT)).toFixed(2);
        }
    }

    if (e.target.name === "price_brutto") {
        const bruttoVal = parseFloat((bruttoInput.value || "0").replace(",", "."));
        if (!Number.isNaN(bruttoVal)) {
            nettoInput.value = (bruttoVal / (1 + VAT)).toFixed(2);
        }
    }
});
</script>

{% endblock %}
