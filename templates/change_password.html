{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:560px;margin:30px auto;">
  <h2>Zmień hasło</h2>
  {% if required %}
  <div role="alert" style="padding:12px;margin-bottom:14px;border-radius:8px;background:#fff7ed;color:#9a3412;">
    Używasz hasła tymczasowego. Przed rozpoczęciem pracy musisz ustawić własne hasło.
  </div>
  {% endif %}
  {% if error %}
  <div role="alert" style="padding:12px;margin-bottom:14px;border-radius:8px;background:#fef2f2;color:#991b1b;">
    {{ error }}
  </div>
  {% endif %}
  <form method="POST" action="/auth/change-password" style="display:grid;gap:10px;">
    <label>Aktualne hasło
      <input name="current_password" type="password" autocomplete="current-password" required style="width:100%;">
    </label>
    <label>Nowe hasło
      <input name="new_password" type="password" autocomplete="new-password" minlength="12" required style="width:100%;">
    </label>
    <label>Powtórz nowe hasło
      <input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required style="width:100%;">
    </label>
    <p style="font-size:13px;color:#6b7280;margin:0;">
      Minimum 12 znaków, mała i duża litera, cyfra oraz znak specjalny.
    </p>
    <button type="submit">Zmień hasło</button>
  </form>
</div>
{% endblock %}
