{% extends "base.html" %}

{% block content %}
<div class="card" style="margin-bottom:16px;">
    <h2>Koszty</h2>
    <form method="POST" action="/add_cost" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px;">
        <input name="name" placeholder="Nazwa" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Kwota / ilość" required>
        <input name="date" type="date" required>
        <input name="description" placeholder="Opis">
        <label style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" name="warehouse_source">
            Z magazynu głównego
        </label>
        <button type="submit">Dodaj koszt</button>
    </form>
</div>

<div class="card">
    <table style="width:100%; border-collapse:collapse;">
        <thead>
            <tr style="background:#fff5e5;">
                <th style="padding:8px; border:1px solid #e5e7eb; text-align:left;">Nazwa</th>
                <th style="padding:8px; border:1px solid #e5e7eb; text-align:right;">Kwota</th>
                <th style="padding:8px; border:1px solid #e5e7eb; text-align:left;">Data</th>
                <th style="padding:8px; border:1px solid #e5e7eb; text-align:left;">Źródło</th>
                <th style="padding:8px; border:1px solid #e5e7eb; text-align:left;">Opis</th>
            </tr>
        </thead>
        <tbody>
            {% for c in costs %}
            <tr>
                <td style="padding:8px; border:1px solid #e5e7eb;">{{ c[1] }}</td>
                <td style="padding:8px; border:1px solid #e5e7eb; text-align:right;">{{ c[2] }}</td>
                <td style="padding:8px; border:1px solid #e5e7eb;">{{ c[3] }}</td>
                <td style="padding:8px; border:1px solid #e5e7eb;">{{ 'warehouse' if c[4] else 'external' }}</td>
                <td style="padding:8px; border:1px solid #e5e7eb;">{{ c[5] or '' }}</td>
            </tr>
            {% else %}
            <tr><td colspan="5" style="padding:8px; border:1px solid #e5e7eb;">Brak kosztów.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
