{% extends "base.html" %}

{% block content %}
<div style="max-width:420px; margin:60px auto; background:white; padding:28px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom:18px;">Logowanie</h2>
    <input id="email" type="email" placeholder="E-mail" style="width:100%; padding:10px; margin-bottom:10px;">
    <input id="password" type="password" placeholder="Hasło" style="width:100%; padding:10px; margin-bottom:15px;">
    <button id="submitBtn" style="width:100%; padding:10px; background:#FFC067; color:#422d00; border:none; border-radius:8px;">
        Zaloguj
    </button>
    <button id="resetBtn" type="button" style="width:100%; margin-top:10px; background:white; border:1px solid #d1d5db;">
        Nie pamiętam hasła
    </button>
    <p id="error" style="color:#dc2626; margin-top:10px;"></p>
    {% if firebase_admin_error or missing_firebase_web_envs %}
    <p style="color:#92400e; margin-top:10px;">
        Logowanie jest chwilowo niedostępne z powodu niepełnej konfiguracji.
        Skontaktuj się z administratorem.
    </p>
    {% endif %}
</div>

<script>
const firebaseAdminReady = {{ "true" if firebase_admin_ready else "false" }};
const firebaseWebReady = {{ "false" if missing_firebase_web_envs else "true" }};
const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

async function submitLogin() {
  if (!firebaseAdminReady || !firebaseWebReady) {
    document.getElementById("error").textContent = "Logowanie jest wyłączone do czasu poprawienia konfiguracji Firebase.";
    return;
  }
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("error");
  const button = document.getElementById("submitBtn");
  err.textContent = "";
  err.style.color = "#dc2626";
  button.disabled = true;
  try {
    const loginResponse = await fetch("/auth/password-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": csrfToken
      },
      body: JSON.stringify({email, password})
    });
    const loginResult = await loginResponse.json();
    if (!loginResponse.ok || !loginResult.ok) {
      throw new Error(loginResult.error || "Nie udało się zalogować.");
    }
    const sessionResponse = await fetch("/auth/session", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRF-Token": csrfToken},
      body: JSON.stringify({idToken: loginResult.idToken})
    });
    const sessionResult = await sessionResponse.json();
    if (!sessionResponse.ok || !sessionResult.ok) {
      throw new Error(sessionResult.error || "Nie udało się utworzyć sesji.");
    }
    window.location.href = sessionResult.redirect || "/";
  } catch (e) {
    err.textContent = e?.message || "Błąd logowania.";
  } finally {
    button.disabled = false;
  }
}

document.getElementById("submitBtn").addEventListener("click", submitLogin);
document.getElementById("password").addEventListener("keydown", event => {
  if (event.key === "Enter") submitLogin();
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("error");
  if (!firebaseWebReady) {
    err.textContent = "Reset hasła jest wyłączony do czasu poprawienia konfiguracji Firebase.";
    return;
  }
  if (!email) {
    err.textContent = "Wpisz adres e-mail.";
    return;
  }
  try {
    const response = await fetch("/auth/forgot-password", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRF-Token": csrfToken},
      body: JSON.stringify({email})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Nie udało się wysłać wiadomości.");
    err.style.color = "#166534";
    err.textContent = result.message;
  } catch (e) {
    err.style.color = "#dc2626";
    err.textContent = e?.message || "Nie udało się wysłać wiadomości.";
  }
});
</script>
{% endblock %}
