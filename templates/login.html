{% extends "base.html" %}

{% block content %}
<div style="max-width:420px; margin:60px auto; background:white; padding:28px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom:18px;">Logowanie</h2>
    <input id="email" type="email" placeholder="E-mail" style="width:100%; padding:10px; margin-bottom:10px;">
    <input id="password" type="password" placeholder="Hasło" style="width:100%; padding:10px; margin-bottom:15px;">
    <button id="submitBtn" style="width:100%; padding:10px; background:#FFC067; color:#422d00; border:none; border-radius:8px;">
        Zaloguj
    </button>
    <button id="resetBtn" type="button" style="width:100%; margin-top:10px; background:white; border:1px solid #d1d5db;">
        Nie pamiętam hasła
    </button>
    <p id="error" style="color:#dc2626; margin-top:10px;"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {{ firebase_config|tojson }};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const firebaseAdminReady = {{ "true" if firebase_admin_ready else "false" }};
document.getElementById("submitBtn").addEventListener("click", async () => {
  if (!firebaseAdminReady) {
    document.getElementById("error").textContent = "Logowanie jest wyłączone do czasu konfiguracji backendu Firebase.";
    return;
  }
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("error");
  err.textContent = "";
  try {
    await setPersistence(auth, browserLocalPersistence);
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const token = await cred.user.getIdToken();
    const res = await fetch("/auth/session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": document.querySelector('meta[name="csrf-token"]').content
      },
      body: JSON.stringify({ idToken: token })
    });
    if (!res.ok) {
      let msg = "Nie udało się utworzyć sesji.";
      try {
        const payload = await res.json();
        if (payload && payload.error) msg = payload.error;
      } catch (_) {}
      throw new Error(msg);
    }
    window.location.href = "/";
  } catch (e) {
    err.textContent = e?.message || "Błąd logowania.";
  }
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const err = document.getElementById("error");
  if (!email) {
    err.textContent = "Wpisz adres e-mail.";
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    err.style.color = "#166534";
    err.textContent = "Wysłaliśmy wiadomość do ustawienia nowego hasła.";
  } catch (e) {
    err.style.color = "#dc2626";
    err.textContent = e?.message || "Nie udało się wysłać wiadomości.";
  }
});
</script>
{% endblock %}
