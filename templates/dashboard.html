{% extends "base.html" %}

{% block content %}

<h2 style="margin-bottom:25px;">Dashboard</h2>

<style>
.stats {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat {
    background:white;
    padding:20px;
    border-radius:16px;
    border:1px solid #eef0f4;
}

.stat-title {
    font-size:13px;
    color:#6b7280;
}

.stat-value {
    font-size:28px;
    font-weight:600;
    margin-top:5px;
}

.card {
    background:white;
    padding:20px;
    border-radius:16px;
    border:1px solid #eef0f4;
}
.stock-row {
    display:grid;
    grid-template-columns:minmax(130px, 1fr) 3fr 90px;
    gap:12px;
    align-items:center;
    margin:10px 0;
}
.stock-track {
    height:14px;
    background:#f1f5f9;
    border-radius:999px;
    overflow:hidden;
}
.stock-bar {
    height:100%;
    background:#FFC067;
    border-radius:999px;
}
</style>

<div class="stats">

<div class="stat">
    <div class="stat-title">Produkty</div>
    <div class="stat-value">{{ total_products }}</div>
</div>

<div class="stat">
    <div class="stat-title">Ilość łączna</div>
    <div class="stat-value">{{ total_qty }}</div>
</div>

</div>

<div class="card">
    <h3>Największe stany</h3>
    {% for product in top_products %}
    <div class="stock-row">
        <div>{{ product[0] }}</div>
        <div class="stock-track">
            <div class="stock-bar" style="width:{{ ((product[1] or 0) / max_top_qty * 100) if max_top_qty else 0 }}%"></div>
        </div>
        <div style="text-align:right;">{{ product[1] }}</div>
    </div>
    {% else %}
    <p>Brak produktów.</p>
    {% endfor %}
</div>

{% endblock %}
