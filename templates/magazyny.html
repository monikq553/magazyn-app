{% extends "base.html" %}

{% block content %}
<h2 style="margin-bottom:18px;">Magazyny</h2>

<div class="tiles">
    {% for warehouse in warehouses %}
    <a class="tile" href="{{ url_for('magazyn', name=warehouse) }}">{{ warehouse }}</a>
    {% endfor %}
    <a class="tile" href="{{ url_for('magazyn', name='Wszystko') }}">Wszystko</a>
</div>
{% endblock %}
